# Главный файл миграций. Порядок include = порядок выполнения.
# Правило: уже применённый changeset НИКОГДА не редактируем — только добавляем новый файл.
databaseChangeLog:
  - include:
      file: db/changelog/changes/001-create-exercise-performances.sql
  - include:
      file: db/changelog/changes/002-add-max-weight.sql
  - include:
      file: db/changelog/changes/003-add-avg-rpe.sql
  - include:
      file: db/changelog/changes/004-create-athlete-profiles.sql
  - include:
      file: db/changelog/changes/005-create-outbox-events.sql
  - include:
      file: db/changelog/changes/006-add-running-metrics.sql
  # общий файл из модуля common-trainer-access (лежит в его ресурсах, Liquibase найдёт в classpath)
  - include:
      file: db/changelog/common/trainer-links.sql
