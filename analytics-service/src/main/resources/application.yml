server:
  port: 8083

spring:
  application:
    name: analytics-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # Consumer group: все экземпляры analytics-service — одна группа.
      # Kafka делит партиции топика между экземплярами группы: каждое сообщение
      # обработает ровно один экземпляр. Другой сервис со своей group-id получит ВСЕ сообщения.
      group-id: analytics-service
      # группа запускается впервые и сохранённой позиции (offset) нет -> читать с самого начала топика
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # offset фиксирует Spring после успешной обработки, а не сам клиент по таймеру
      enable-auto-commit: false
    producer:
      # продюсер: события аналитики (через outbox) и "битые" сообщения в DLT
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:           # "[...]" — чтобы точки в имени были частью ключа, а не вложенностью
        "[enable.idempotence]": true
        "[max.block.ms]": 5000
        "[request.timeout.ms]": 5000
        "[delivery.timeout.ms]": 10000
    listener:
      # подтверждать (commit offset) каждое сообщение сразу после обработки
      ack-mode: record
  jpa:
    open-in-view: false          # не держим соединение с БД открытым до конца HTTP-запроса
    hibernate:
      ddl-auto: validate         # схему создаёт Liquibase, Hibernate только проверяет
  liquibase:
    enabled: true                # при старте сервис сам накатывает новые миграции
    change-log: classpath:db/changelog/db.changelog-master.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  kafka:
    topics:
      workout-events: workout-events
      user-events: user-events
      analytics-events: analytics-events
  outbox:
    topic: ${app.kafka.topics.analytics-events}
    poll-interval-ms: 1000
  insights:
    # о тренировках старше этого срока не уведомляем (повторная доставка, перезаливка данных)
    notify-max-age: 7d
  reports:
    # 1-го числа в 06:00 UTC — "отчёт за прошлый месяц готов" (cron: сек мин час день месяц день_недели)
    monthly-cron: "0 0 6 1 * *"
  jwt:
    secret: ${JWT_SECRET}         # тот же ключ, что у user-service
