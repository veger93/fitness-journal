  - include:
      file: db/changelog/changes/003-create-notifications.sql
  - include:
      file: db/changelog/changes/004-create-workout-activity.sql
  - include:
      file: db/changelog/changes/005-notifications-read-at.sql
  - include:
      file: db/changelog/changes/006-weekly-plan-reminders.sql
  - include:
      file: db/changelog/changes/007-trainer-notifications.sql
  # общий файл из модуля common-trainer-access (лежит в его ресурсах, Liquibase найдёт в classpath)
  - include:
      file: db/changelog/common/trainer-links.sql
