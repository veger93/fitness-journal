server:
  port: 8082

spring:
  application:
    name: workout-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # ключ и значение отправляем строками: ключ = userId, значение = JSON события
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # acks=all: брокер подтверждает запись только когда она сохранена на всех репликах
      acks: all
      properties:           # "[...]" — чтобы точки в имени были частью ключа, а не вложенностью
        "[enable.idempotence]": true    # повторная отправка при сбое сети не создаст дубль в топике
        "[max.block.ms]": 5000          # Kafka недоступна -> ошибка через 5 сек, а не через минуту
        "[request.timeout.ms]": 5000
        "[delivery.timeout.ms]": 10000
  jpa:
    open-in-view: false          # не держим соединение с БД открытым до конца HTTP-запроса
    hibernate:
      ddl-auto: validate         # схему создаёт Liquibase, Hibernate только проверяет
    properties:
      hibernate:
        # ленивые связи (упражнения тренировки, подходы, упражнения каталога) грузятся пачками по 50 id
        # одним запросом "where id in (...)", а не по запросу на каждую строку — защита от N+1 (журнал истории)
        default_batch_fetch_size: 50
  liquibase:
    enabled: true                # при старте сервис сам накатывает новые миграции
    change-log: classpath:db/changelog/db.changelog-master.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  kafka:
    topics:
      workout-events: workout-events
  outbox:
    topic: ${app.kafka.topics.workout-events}   # куда common-outbox отправляет события этого сервиса
    poll-interval-ms: 1000        # как часто отправлять накопившиеся события
  jwt:
    secret: ${JWT_SECRET}         # ТОТ ЖЕ ключ, что у user-service: иначе подпись токена не сойдётся
