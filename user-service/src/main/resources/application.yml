server:
  port: 8081

spring:
  application:
    name: user-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:           # "[...]" — чтобы точки в имени были частью ключа, а не вложенностью
        "[enable.idempotence]": true
        "[max.block.ms]": 5000
        "[request.timeout.ms]": 5000
        "[delivery.timeout.ms]": 10000
  jpa:
    open-in-view: false          # не держим соединение с БД открытым до конца HTTP-запроса
    hibernate:
      ddl-auto: validate         # схему создаёт Liquibase, Hibernate только проверяет
  liquibase:
    enabled: true                # при старте сервис сам накатывает новые миграции
    change-log: classpath:db/changelog/db.changelog-master.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  kafka:
    topics:
      user-events: user-events
  outbox:
    topic: ${app.kafka.topics.user-events}
    poll-interval-ms: 1000
  jwt:
    secret: ${JWT_SECRET}         # base64, минимум 256 бит; в проде — только через переменную окружения
    access-token-ttl: 15m         # короткий access-токен (Duration: 15m, 1h, 1d); фронт сам обновит его по refresh
    refresh-token-ttl: 30d        # refresh-токен в httpOnly-cookie: столько можно не вводить пароль
    cookie-secure: ${COOKIE_SECURE:true}   # в проде только HTTPS
