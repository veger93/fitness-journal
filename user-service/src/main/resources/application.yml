server:
  port: 8081

spring:
  application:
    name: user-service
  jpa:
    open-in-view: false          # не держим соединение с БД открытым до конца HTTP-запроса
    hibernate:
      ddl-auto: validate         # схему создаёт Liquibase, Hibernate только проверяет
  liquibase:
    enabled: true                # при старте сервис сам накатывает новые миграции
    change-log: classpath:db/changelog/db.changelog-master.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET}         # base64, минимум 256 бит; в проде — только через переменную окружения
    access-token-ttl: 1h          # время жизни токена (Duration: 15m, 1h, 1d)
