# Главный файл миграций. Порядок include = порядок выполнения.
# Правило: уже применённый changeset НИКОГДА не редактируем — только добавляем новый файл.
databaseChangeLog:
  - include:
      file: db/changelog/changes/001-create-users.sql
  - include:
      file: db/changelog/changes/002-create-user-profiles.sql
  - include:
      file: db/changelog/changes/003-create-body-weight-log.sql
