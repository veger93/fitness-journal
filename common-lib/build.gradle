// Обычная библиотека (НЕ Spring Boot приложение) — поэтому без плагина boot и без main-класса
plugins {
    id 'java-library'
}

dependencies {
    // api = зависимость "протекает" в сервисы, которые подключают common-lib
    api 'jakarta.validation:jakarta.validation-api'

    // compileOnly = нужно только чтобы скомпилировать CommonExceptionHandler.
    // В рантайме эти классы и так есть у каждого сервиса (spring-boot-starter-web, data-jpa).
    compileOnly 'org.springframework:spring-web'
    compileOnly 'org.springframework:spring-webmvc'
    compileOnly 'org.springframework:spring-tx'
    compileOnly 'jakarta.servlet:jakarta.servlet-api'
    compileOnly 'org.slf4j:slf4j-api'
}
