<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Vegas — дневник тренировок</title>
    <!-- описание сайта в выдаче поисковиков и в превью ссылок в мессенджерах -->
    <meta name="description" content="Дневник тренировок с аналитикой: графики силы, рекорды, подсказки, когда добавить вес, и детектор плато. Бесплатно, без рекламы." />
    <!--
      Превью ссылки в Telegram, WhatsApp, VK и др. (протокол Open Graph): заголовок, описание и картинка 1200×630.
      Адреса — полные, с доменом: мессенджер скачивает картинку сам, относительный путь он не поймёт.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vegas" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:url" content="https://vegas-fit.ru/" />
    <meta property="og:title" content="Vegas — дневник тренировок" />
    <meta property="og:description" content="Графики силы, рекорды и подсказки, когда добавить вес. Бесплатно, без рекламы." />
    <meta property="og:image" content="https://vegas-fit.ru/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vegas: мышцы растут от прогресса" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Иконки: вкладка браузера (SVG — современные браузеры, ICO — остальные), экран "Домой" iPhone, Android/PWA -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- подпись под иконкой на iPhone и цвет полосы браузера/статус-бара — под светлую и тёмную тему -->
    <meta name="apple-mobile-web-app-title" content="Vegas" />
    <meta name="theme-color" content="#eef1f5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet" />
    <script>
      // Тему ставим ДО загрузки React: иначе тёмная тема на мгновение мигнёт светлой.
      // Логика та же, что в src/theme/theme.ts (здесь копия — React ещё не загружен).
      (function () {
        var choice = 'system';
        try { choice = localStorage.getItem('vegas.theme') || 'system'; } catch (e) {}
        var dark = choice === 'dark' ||
          (choice === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        // цвет полосы браузера — как THEME_COLOR в src/theme/theme.ts
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0b0f17' : '#eef1f5');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
