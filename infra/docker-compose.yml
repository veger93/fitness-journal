# Запуск: из папки infra -> docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: vegas-postgres
    environment:
      POSTGRES_USER: vegas
      POSTGRES_PASSWORD: vegas
      POSTGRES_DB: postgres
    ports:
      - "5435:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      # скрипты из этой папки выполняются ТОЛЬКО при первом создании тома
      - ./postgres-init:/docker-entrypoint-initdb.d
    restart: unless-stopped

  # Ловушка для писем: notification-service шлёт сюда, смотрим в браузере http://localhost:8025
  mailpit:
    image: axllent/mailpit
    container_name: vegas-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  # Kafka в режиме KRaft: без ZooKeeper, один узел работает и брокером, и контроллером.
  kafka:
    image: apache/kafka:3.8.0
    container_name: vegas-kafka
    ports:
      - "9092:9092"   # для сервисов, запущенных из IDEA (localhost:9092)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # три "входа" в брокер:
      #   PLAINTEXT       :29092 — для контейнеров внутри docker-сети (kafka-ui, позже наши сервисы в docker)
      #   PLAINTEXT_HOST  :9092  — для приложений на хосте (IDEA)
      #   CONTROLLER      :9093  — служебный, для управления кластером
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      # адреса, которые брокер СООБЩАЕТ клиентам: внутри docker — kafka:29092, снаружи — localhost:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # id кластера: base64 от UUID (22 символа). Сгенерирован один раз, менять не нужно
      CLUSTER_ID: KdRvp5eoT3GrO7nej_01zA
      # узел один -> служебные топики без реплик
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # топики создают сами сервисы (NewTopic в коде), опечатка в имени не создаст "левый" топик
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  # Веб-интерфейс для Kafka: топики, сообщения, consumer groups -> http://localhost:8090
  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: vegas-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    restart: unless-stopped

  # --- позже ---
  # minio:   S3-хранилище для анимаций упражнений и аватарок

volumes:
  pg-data:
  kafka-data:
