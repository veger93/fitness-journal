# CD — выкладка на сервер. Запускается сам, когда CI на ветке main прошёл успешно (то есть после мержа PR).
# Можно запустить и вручную: вкладка Actions -> Deploy -> Run workflow.
#
# Шаги:
#   1) собрать Docker-образы всех сервисов и фронта, положить в GitHub Container Registry (ghcr.io);
#   2) зайти на сервер по SSH, скопировать туда deploy/, скачать новые образы и перезапустить контейнеры.
#
# Пока сервер не настроен, выкладка выключена: включается переменной репозитория DEPLOY_ENABLED=true
# (Settings -> Secrets and variables -> Actions -> вкладка Variables). Секреты — там же, вкладка Secrets.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# одна выкладка за раз: если смержили два PR подряд, вторая подождёт первую
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/vegas
  # коммит, который проверил CI (при ручном запуске — последний в main)
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  images:
    name: Образ ${{ matrix.image }}
    if: vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # право класть образы в ghcr.io этого репозитория
    strategy:
      matrix:
        include:
          - { image: gateway-service, context: ., service: gateway-service }
          - { image: user-service, context: ., service: user-service }
          - { image: workout-service, context: ., service: workout-service }
          - { image: analytics-service, context: ., service: analytics-service }
          - { image: notification-service, context: ., service: notification-service }
          - { image: web, context: frontend, service: '' }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN выдаётся на время запуска автоматически, отдельный пароль для ghcr.io не нужен
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: SERVICE=${{ matrix.service }}
          push: true
          # два тега: точная версия (коммит) — чтобы можно было откатиться, и latest
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ env.SHA }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:latest
          # кэш слоёв между запусками: неизменившиеся слои не пересобираются
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  server:
    name: Выкладка на сервер
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Копируем deploy/ на сервер
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: deploy/docker-compose.yml,deploy/postgres-init,deploy/status.sh
          target: ~/vegas
          strip_components: 1

      - name: Скачиваем образы и перезапускаем
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          SHA: ${{ env.SHA }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,SHA
          script_stop: true
          # по умолчанию 10 минут: при медленной сети сервера скачивание образов не успевало
          command_timeout: 30m
          script: |
            cd ~/vegas
            # временный вход в ghcr.io: токен живёт только пока идёт этот запуск
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            # сначала скачиваем новые образы (TAG из окружения важнее, чем в .env), и только потом
            # меняем версию в .env: оборвётся скачивание — .env и работающие сервисы останутся на старой версии
            TAG=$SHA docker compose pull
            sed -i "s/^TAG=.*/TAG=$SHA/" .env
            docker compose up -d --remove-orphans
            docker logout ghcr.io
            # старые образы занимают диск — удаляем те, что больше не используются
            docker image prune -f
