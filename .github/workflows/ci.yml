# CI — проверка кода. Запускается на каждый pull request и на каждый push в main.
# Красный крестик в PR = тесты или сборка упали, мержить нельзя (это можно сделать обязательным в настройках ветки).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# новый push в ту же ветку отменяет ещё не закончившуюся проверку — не ждём устаревший результат
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # кэш ~/.gradle между запусками: зависимости не скачиваются каждый раз заново
      - uses: gradle/actions/setup-gradle@v4

      - name: Тесты и сборка всех сервисов
        run: ./gradlew build --no-daemon

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: Форматирование (prettier)
        run: npm run format:check

      - name: Тесты (vitest)
        run: npm test

      - name: Сборка (tsc + vite)
        run: npm run build
